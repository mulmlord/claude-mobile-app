[project]
name = "claude-bridge"
version = "0.1.0"
description = "Bridge between running Claude Code sessions and the Claude Mobile Android app"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14,<4",
    "pyte>=0.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_bridge"]
