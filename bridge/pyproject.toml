[project]
name = "claude-bridge"
version = "0.1.0"
description = "Bridge between running Claude Code sessions and the Claude Mobile Android app"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14,<4",
    "pyte>=0.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_bridge"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-aiohttp>=1.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
